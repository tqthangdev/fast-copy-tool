name: Build Fast Copy Tool

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------------- #
  # Build Windows
  # ------------------------------------------------------------------------- #
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify assets
        shell: pwsh
        run: |
          if (-not (Test-Path "assets\icon.png")) {
            Write-Error "Missing assets\icon.png"
          }

          if (-not (Test-Path "assets\icon.ico")) {
            Write-Error "Missing assets\icon.ico"
          }

      - name: Build executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name FastCopyTool
          --icon assets/icon.ico
          --add-data "assets;assets"
          main.py

      - name: Rename executable
        run: Rename-Item dist\FastCopyTool.exe FastCopyTool-Windows.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/FastCopyTool-Windows.exe

  # ------------------------------------------------------------------------- #
  # Build Linux AppImage
  # ------------------------------------------------------------------------- #
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify assets
        run: |
          test -f assets/icon.png
          test -f assets/icon.ico

      - name: Build PyInstaller binary
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name FastCopyTool \
            --add-data "assets:assets" \
            main.py

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/FastCopyTool \
             AppDir/usr/bin/FastCopyTool

          cp assets/icon.png AppDir/.DirIcon
          cp assets/icon.png AppDir/FastCopyTool.png

          cp assets/icon.png \
             AppDir/usr/share/icons/hicolor/256x256/apps/FastCopyTool.png

          cat > AppDir/usr/share/applications/FastCopyTool.desktop << 'EOF'
          [Desktop Entry]
          Name=Fast Copy Tool
          Comment=Fast cross-platform file copy and move tool
          Exec=FastCopyTool
          Icon=FastCopyTool
          Terminal=false
          Type=Application
          Categories=Utility;FileTools;
          EOF

          chmod +x AppDir/usr/bin/FastCopyTool

      - name: Download linuxdeploy
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Build AppImage
        env:
          LDAI_OUTPUT: FastCopyTool-Linux.AppImage
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/FastCopyTool.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/FastCopyTool.png \
            --output appimage

      - name: Verify AppImage
        run: |
          test -f FastCopyTool-Linux.AppImage
          ls -lh FastCopyTool-Linux.AppImage

      - name: Make AppImage executable
        run: chmod +x FastCopyTool-Linux.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: FastCopyTool-Linux.AppImage

  # ------------------------------------------------------------------------- #
  # Create GitHub Release
  # ------------------------------------------------------------------------- #
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release

      - name: Show release files
        run: |
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FastCopyTool-Windows.exe
            release/FastCopyTool-Linux.AppImage
          generate_release_notes: true