name: Build Fast Copy Tool

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------------- #
  # Build Windows
  # ------------------------------------------------------------------------- #
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify assets
        shell: pwsh
        run: |
          if (-not (Test-Path "assets\icon.png")) {
            Write-Error "Missing assets\icon.png"
          }

          if (-not (Test-Path "assets\icon.ico")) {
            Write-Error "Missing assets\icon.ico"
          }

      - name: Build Windows
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name FastCopyTool
          --icon assets/icon.ico
          --add-data "assets;assets"
          main.py

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FastCopyTool\FastCopyTool.exe")) {
            Write-Error "Build failed: FastCopyTool.exe not found"
          }

          Get-ChildItem -Recurse dist\FastCopyTool

      - name: Package Windows
        run: |
          Compress-Archive `
            -Path dist\FastCopyTool `
            -DestinationPath FastCopyTool-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: FastCopyTool-Windows.zip

  # ------------------------------------------------------------------------- #
  # Build Linux
  # ------------------------------------------------------------------------- #
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify assets
        run: |
          test -f assets/icon.png
          test -f assets/icon.ico

      - name: Build Linux
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --name FastCopyTool \
            --add-data "assets:assets" \
            main.py

      - name: Verify build
        run: |
          test -f dist/FastCopyTool/FastCopyTool
          find dist/FastCopyTool -maxdepth 2 -type f -print

      - name: Make executable
        run: chmod +x dist/FastCopyTool/FastCopyTool

      - name: Package Linux
        run: |
          zip -r FastCopyTool-Linux.zip dist/FastCopyTool

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: FastCopyTool-Linux.zip

  # ------------------------------------------------------------------------- #
  # Create GitHub Release
  # ------------------------------------------------------------------------- #
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    # Only create a release when a v* tag is pushed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release

      - name: Show release files
        run: |
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FastCopyTool-Windows.zip
            release/FastCopyTool-Linux.zip
          generate_release_notes: true
