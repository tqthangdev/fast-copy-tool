name: Build Fast Copy Tool

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --windowed ^
            --name FastCopyTool ^
            main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FastCopyTool-Windows
          path: dist/FastCopyTool.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name FastCopyTool \
            main.py

      - name: Make executable
        run: chmod +x dist/FastCopyTool

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: FastCopyTool-Linux
          path: dist/FastCopyTool